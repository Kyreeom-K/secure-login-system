{% extends "base.html" %}{% block content %}
<h1>Create account</h1>
<form method="post">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <label>Username</label><input name="username" required maxlength="30">
 <label>Email</label><input name="email" type="email" required>
 <label>Password</label><input name="password" type="password" required minlength="8" autocomplete="new-password">
 <button>Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
