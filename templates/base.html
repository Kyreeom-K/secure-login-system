<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Login System</title>
<style>
 body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;display:flex;justify-content:center;padding:3rem 1rem}
 .card{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 2px 12px #0001;width:100%;max-width:380px}
 h1{margin-top:0;font-size:1.4rem}
 label{display:block;margin:.8rem 0 .2rem;font-size:.9rem}
 input{width:100%;padding:.6rem;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
 button{margin-top:1rem;width:100%;padding:.7rem;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:1rem;cursor:pointer}
 .flash{padding:.6rem;border-radius:6px;margin-bottom:.6rem;font-size:.9rem}
 .error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
 code{word-break:break-all;background:#eee;padding:.1rem .3rem;border-radius:4px}
 a{color:#2563eb}
</style>
</head>
<body><div class="card">
{% with msgs = get_flashed_messages(with_categories=true) %}
 {% for cat, m in msgs %}<div class="flash {{cat}}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div></body></html>
